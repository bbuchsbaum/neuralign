name: Ecosystem compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  dkge-provider:
    name: dkge provider contract
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pak
      - name: Install neuralign from this checkout
        shell: bash
        run: R CMD INSTALL .
      - name: Install the downstream provider
        shell: Rscript {0}
        run: pak::pkg_install("bbuchsbaum/dkge")
      - name: Exercise provider registration and fit contract
        shell: Rscript {0}
        run: |
          library(neuralign)
          library(dkge)
          stopifnot(is_aligner_registered("dkge"))
          effects <- paste0("effect_", 1:4)
          K <- diag(4)
          dimnames(K) <- list(effects, effects)
          x1 <- rbind(c(1, 0, 0, 0), c(0, 1, 0, 0))
          x2 <- rbind(c(0, 1, 0, 0), c(1, 0, 0, 0))
          data <- AlignmentData(
            list(s1 = x1, s2 = x2),
            design = list(K = K, effects = effects)
          )
          fit <- fit_alignment(
            data,
            method = "dkge",
            reference = "s1",
            compute_quality = FALSE
          )
          stopifnot(inherits(fit, "AlignmentResult"))
